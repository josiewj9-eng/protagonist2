  let qn = null; if (ext && !PROF.q){ qn = gl.createQuery(); gl.beginQuery(ext.TIME_ELAPSED_EXT, qn); }
  const dt = Math.min(0.1, (now - last)/1000); last = now;
  // the world moves in fixed steps of 1/30 s (HOUR_SEC s a world hour): the same steps whatever is being watched; a frame takes at most 6
  // (a slow frame or a hidden tab does not make the world run to catch up — it waits, and the time lost is counted in SIM.lost)
  SIM.acc += PAUSED ? 0 : dt*TIME_SPEED; let n = 0; const nMax = 6*Math.max(1, Math.ceil(TIME_SPEED));
  while (SIM.acc >= SIM.step && n < nMax){ SIM.acc -= SIM.step; n++; SIM.steps++; const m = worldMin(); DAY = Math.floor(m/1440); HOUR = (m % 1440)/60;
    WX.tick(SIM.step, HOUR, autoWeather); tick(SIM.step); }
  if (n === nMax && SIM.acc > SIM.step){ SIM.lost += SIM.acc; SIM.acc = 0; }
  moveCam(dt);
  if (PEEK){ cam.position.set(...PEEK.p); cam.lookAt(...PEEK.t); }
  { // r5: near plane from the height over the ground — from above, 0.1 m left ~1 cm of depth precision at the town, so the road
    // markings, slabs and paths 1–2 cm apart flickered against each other; on foot it stays 0.1 m
    const nr = clamp((cam.position.y - WORLD.floorAt(cam.position.x, cam.position.z))*0.04, 0.1, 6); if (Math.abs(nr - cam.near) > 0.02){ cam.near = nr; cam.updateProjectionMatrix(); } }
  { // the rain: round the camera, over what the view shows, rings where one stands (see weather.js place())
    const pl = view.mode === 'player', f = pl ? _rf.set(PLAYER.x, PLAYER.y, PLAYER.z) : PEEK ? _rf.set(PEEK.t[0], PEEK.t[1], PEEK.t[2]) : _rf.copy(view.target);
    const span = pl ? 150 : PEEK ? 200 : view.dist*2.3 + 40; WX.place(cam.position, f, span, WORLD.floorAt(cam.position.x, cam.position.z)); }
  applySky();
  HUD.style.display = 'none';
  SHADOW_N++; renderer.shadowMap.needsUpdate = sun.intensity > 0.02 && (QUALITY.every <= 1 || SHADOW_N % QUALITY.every === 0);   // every frame (see shadowRig)
  skyDome.position.copy(cam.position); stars.position.copy(cam.position); roomLodTick();
  for (const c of CLOCKS){ const t = HOUR % 12; c.hr.rotation.z = -t/12*Math.PI*2; c.mn.rotation.z = -(t % 1)*Math.PI*2; }
  WATER_TEX.forEach((t, i)=>{ t.offset.y -= dt*(i ? 0.03 : 0.01); });
  renderer.info.reset(); VIEWS.pre(dt); try { OILF.render(cam, dt, view.mode === 'life' ? VIEWS.focus() : view.mode === 'player' ? Math.max(4, view.cdistNow || 4) : view.dist); } finally { VIEWS.post(); } OILF.benchTick(dt*1000); OILF.panelTick(); envPanelTick(); soundTick(dt);
  if (GRAB.want){ const w = renderer.domElement.width, h = renderer.domElement.height, px = new Uint8Array(w*h*4); gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px); const f = GRAB.want; GRAB.want = null; f({ w, h, px }); }
  if (qn){ gl.endQuery(ext.TIME_ELAPSED_EXT); PROF.q = qn; }
  PROF.cpu.push(performance.now() - tf0); if (PROF.cpu.length > 600) PROF.cpu.shift(); DEVP.tick(dt);
  requestAnimationFrame(frame);
}

  el.style.cssText = 'position:fixed;left:12px;top:12px;bottom:12px;z-index:98;width:360px;overflow:auto;padding:10px 12px;border-radius:10px;background:rgba(20,18,28,.88);color:#eee;font:11px/1.45 ui-monospace,Menlo,monospace;user-select:none';

  btns(JUMPS.map(([t, h])=>[t, ()=>setWorldHour(h)]));
